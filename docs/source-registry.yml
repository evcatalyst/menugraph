    priority: 2
    access:
      method: "contentdm_api"
      bulk_available: true
      source_url: "https://archives-nolalibrary.contentdm.oclc.org/digital/collection/p16880coll68"
      api_url: "https://archives-nolalibrary.contentdm.oclc.org/digital/api"
    rights:
