name: Sync MenuGraph Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

permissions:
  contents: write

concurrency:
  group: menugraph-data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prepare NYPL cache
        run: npm run prepare:nypl

      - name: Build static data snapshots
        run: npm run build:data:full

      - name: Validate generated app
        run: npm test

      - name: Commit refreshed snapshots
        run: |
          if git diff --quiet -- docs/data package-lock.json package.json; then
            echo "No snapshot changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data package.json package-lock.json
          git commit -m "Sync MenuGraph static data"
          git push
